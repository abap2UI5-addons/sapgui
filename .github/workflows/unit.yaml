# The ABAP Unit tests of src/, transpiled to JavaScript and run in Node -
# no SAP system needed. The apps reach the system only through
# ZIF_ZLK05_SYS_API, ZIF_ZLK05_AUTH_SYS and ZIF_SE80_API; the tests put
# doubles in front of them, and the classes that read the database are
# left out of the transpile (node/setup/abap_transpile.json). Their own
# tests run on a system only. README, "Development".
name: unit

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run transpile
      - run: npm run unit
